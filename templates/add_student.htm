{% extends "base.html" %}

{% block title %}
Add Student
{% endblock %}

{% block content %}

<h1>Add Student</h1>

<form
    method="POST"
    class="form"
>

    <label>
        Student ID
    </label>

    <input
        type="text"
        name="student_id"
        placeholder="ST001"
        required
    >

    <label>
        Student Name
    </label>

    <input
        type="text"
        name="name"
        required
    >

    <label>
        Class
    </label>

    <input
        type="text"
        name="class"
        placeholder="BCA"
        required
    >

    <label>
        Year
    </label>

    <input
        type="number"
        name="year"
        min="1"
        max="5"
        required
    >

    <label>
        Department
    </label>

    <input
        type="text"
        name="department"
        required
    >

    <label>
        Email
    </label>

    <input
        type="email"
        name="email"
    >

    <button
        type="submit"
        class="button"
    >
        Add Student
    </button>

</form>

{% endblock %}
